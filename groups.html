    <div class="notes-page">
        <div class="app">
            <h1>WRITING GROUPS</h1>

            <!-- Sign-in gate -->
            <div id="groupsSignInGate" style="display:none;text-align:center;padding:40px 0;">
                <p style="font-size:0.8rem;color:var(--text-dim);letter-spacing:1px;margin-bottom:20px;">SIGN IN TO ACCESS LEADERBOARDS AND FRIENDS</p>
                <button onclick="dpOpenSignIn()" style="width:100%;max-width:300px;">⊕ SIGN IN</button>
            </div>

            <!-- Main content (shown when signed in) -->
            <div id="groupsContent" style="display:none;">

                <!-- Pending friend requests -->
                <div id="pendingRequestsSection" style="display:none;margin-bottom:30px;">
                    <span style="font-size:0.75rem;letter-spacing:1px;color:var(--text-dim);">FRIEND REQUESTS</span>
                    <div id="pendingRequestsList" style="margin-top:10px;"></div>
                </div>

                <!-- Add friend -->
                <div style="margin-bottom:30px;">
                    <label for="friendUsernameInput" style="font-size:0.75rem;letter-spacing:1px;color:var(--text-dim);">ADD FRIEND BY USERNAME</label>
                    <div style="display:flex;gap:8px;margin-top:8px;">
                        <input type="text" id="friendUsernameInput" placeholder="USERNAME"
                            style="flex:1;min-width:0;text-transform:uppercase;"
                            oninput="this.value=this.value.toUpperCase().replace(/[^A-Z0-9_]/g,'')"
                            onkeydown="if(event.key==='Enter') doAddFriend()">
                        <button class="btn-primary" onclick="doAddFriend()" style="white-space:nowrap;">+ ADD</button>
                    </div>
                    <p id="addFriendMsg" style="font-size:0.75rem;height:1.2em;margin-top:6px;letter-spacing:1px;"></p>
                </div>

                <!-- Friends leaderboard -->
                <div style="margin-bottom:30px;">
                    <label for="friendsSearch" style="font-size:0.75rem;letter-spacing:1px;color:var(--text-dim);">YOUR FRIENDS</label>
                    <input type="text" id="friendsSearch" placeholder="SEARCH FRIENDS"
                        style="width:100%;box-sizing:border-box;margin-top:8px;text-transform:uppercase;"
                        oninput="filterFriends(this.value)">
                    <div id="friendsList" style="margin-top:10px;"></div>
                </div>

                <!-- Shared with me: folded to one line by default -->
                <div style="margin-bottom:30px;">
                    <button type="button" id="swmToggle" class="swm-toggle" aria-expanded="false" aria-controls="sharedWithMeList" onclick="toggleSharedWithMe()">
                        <span class="swm-caret" aria-hidden="true">▸</span>
                        <span class="swm-title">SHARED WITH ME</span>
                        <span id="swmSummary" class="swm-summary"></span>
                    </button>
                    <div id="sharedWithMeList" style="margin-top:10px;" hidden></div>
                </div>

                <!-- My groups -->
                <div style="margin-bottom:30px;">
                    <div class="grp-section-head">
                        <span style="font-size:0.75rem;letter-spacing:1px;color:var(--text-dim);">MY GROUPS</span>
                        <button id="grpNewBtn" class="grp-new-btn btn-secondary" onclick="toggleNewGroup()">＋ NEW GROUP</button>
                    </div>
                    <div id="grpNewPanel" class="grp-new-panel" style="display:none;">
                        <label for="grpNewName" class="grp-label">GROUP NAME</label>
                        <input type="text" id="grpNewName" maxlength="60" placeholder="e.g. Thursday writers">
                        <div class="grp-label" style="margin-top:12px;">ADD FRIENDS</div>
                        <div id="grpNewPicker"></div>
                        <div class="grp-new-foot">
                            <button type="button" onclick="createGroupHere()">CREATE GROUP</button>
                            <button type="button" class="grp-cancel-btn" onclick="toggleNewGroup(false)">CANCEL</button>
                        </div>
                        <p id="grpNewMsg" class="grp-new-msg" role="status"></p>
                    </div>
                    <div style="display:flex;gap:4px;margin-top:8px;margin-bottom:8px;">
                        <button class="lb-period-btn-g grp-period-btn lb-period-active" data-gperiod="week"  onclick="setGroupPeriod('week')">THIS WEEK</button>
                        <button class="lb-period-btn-g grp-period-btn" data-gperiod="month" onclick="setGroupPeriod('month')">THIS MONTH</button>
                        <button class="lb-period-btn-g grp-period-btn" data-gperiod="year"  onclick="setGroupPeriod('year')">THIS YEAR</button>
                        <button class="lb-period-btn-g grp-period-btn" data-gperiod="all"   onclick="setGroupPeriod('all')">ALL TIME</button>
                    </div>
                    <div id="myGroupsList"></div>
                </div>

                <!-- Global leaderboard -->
                <div>
                    <span style="font-size:0.75rem;letter-spacing:1px;color:var(--text-dim);">GLOBAL LEADERBOARD</span>
                    <div style="display:flex;gap:4px;margin-top:8px;margin-bottom:8px;">
                        <button class="lb-period-btn lb-period-active" data-period="week"  onclick="setLeaderboardPeriod('week')" >THIS WEEK</button>
                        <button class="lb-period-btn"                  data-period="month" onclick="setLeaderboardPeriod('month')">THIS MONTH</button>
                        <button class="lb-period-btn"                  data-period="year"  onclick="setLeaderboardPeriod('year')" >THIS YEAR</button>
                        <button class="lb-period-btn"                  data-period="all"   onclick="setLeaderboardPeriod('all')"  >ALL TIME</button>
                    </div>
                    <div id="leaderboardList"></div>
                </div>

            </div>
        </div>
    </div>

    <div id="shareViewOverlay" class="overlay" style="display:none;" onclick="if(event.target===this)closeShareView()">
        <div class="congrats-box" style="max-width:600px;width:95%;max-height:80vh;display:flex;flex-direction:column;">
            <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:6px;">
                <div>
                    <h2 id="shareViewTitle" style="color:var(--neon);margin:0 0 4px;"></h2>
                    <div id="shareViewMeta" style="font-size:0.75rem;color:var(--text-dim);letter-spacing:1px;"></div>
                </div>
                <div style="display:flex;gap:6px;flex-shrink:0;">
                    <button class="btn-secondary" id="shareViewReport" style="min-width:unset;width:auto;padding:4px 10px;font-size:0.75rem;white-space:nowrap;">⚑ REPORT</button>
                    <button class="btn-secondary" onclick="closeShareView()" style="min-width:unset;width:auto;padding:4px 10px;font-size:0.75rem;white-space:nowrap;">✕ CLOSE</button>
                </div>
            </div>
            <div id="shareViewContent" style="flex:1;overflow-y:auto;margin-top:12px;font-size:0.9rem;line-height:1.8;text-align:left;border-top:1px solid var(--border);padding-top:12px;"></div>
            <div id="swmFeedback" class="swm-fb"></div>
        </div>
