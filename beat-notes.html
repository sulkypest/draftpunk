<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEAT NOTES</title>
    <link rel="icon" href="DRAFTPUNK.png" type="image/png">
    <link rel="stylesheet" href="style.css?v=20261124a">
    <script src="sentry.js?v=20261123g"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Draft Punk">
</head>
<body>

    <nav class="app-nav">
        <div class="nav-dropdown">
            <button class="nav-dropdown-btn" onclick="toggleDraftMenu()">DRAFT PUNK ▾</button>
            <div class="nav-dropdown-menu" id="draftMenu">
                <a href="index.html?dashboard" class="nav-dropdown-item">DASHBOARD</a>
                <a href="wordrunner.html" class="nav-dropdown-item">WORDRUNNER</a>
                <a href="groups.html" class="nav-dropdown-item">WRITING GROUPS</a>
                <a href="messages.html" class="nav-dropdown-item">MESSAGES</a>
            </div>
        </div>
        <a href="write.html" class="nav-center-btn">WRITE</a>
        <div class="nav-dropdown" style="margin-left:auto;">
            <button class="nav-dropdown-btn active" onclick="toggleNotesMenu()">STORY ▾</button>
            <div class="nav-dropdown-menu" id="notesMenu">
                <a href="beat-notes.html" class="nav-dropdown-item" style="color:var(--neon);">BEATS</a>
                <a href="characters.html" class="nav-dropdown-item">CHARACTERS</a>
            </div>
        </div>
        <div class="nav-dropdown">
            <button class="nav-dropdown-btn" onclick="toggleDataMenu()">··· <span id="syncDot" style="display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:2px;vertical-align:middle;transition:background 0.4s;"></span></button>
            <div class="nav-dropdown-menu" id="dataMenu">
                <button class="nav-dropdown-item" id="themeToggle" onclick="toggleTheme()">LIGHT MODE</button>
                <div style="border-top:1px solid var(--border);margin:2px 0;"></div>
                <button class="nav-dropdown-item" onclick="exportData(); toggleDataMenu()">⬇ BACKUP</button>
                <button class="nav-dropdown-item" onclick="dpRestore(); toggleDataMenu()">⬆ RESTORE</button>
                <div style="border-top:1px solid var(--border);margin:2px 0;"></div>
                <button id="navSignIn" class="nav-dropdown-item" onclick="dpOpenSignIn(); toggleDataMenu()" style="color:var(--neon);">⊕ SIGN IN</button>
                <div id="navUserInfo" style="display:none;">
                    <div class="nav-dropdown-item" style="display:flex;align-items:center;gap:8px;cursor:default;">
                        <img id="navAvatar" src="" style="width:20px;height:20px;border-radius:50%;border:1px solid var(--neon);">
                        <span id="navUserName" style="color:var(--neon);font-size:0.75rem;"></span>
                    </div>
                    <button class="nav-dropdown-item" onclick="signOutUser(); toggleDataMenu()">⊖ SIGN OUT</button>
                </div>
                <div style="border-top:1px solid var(--border);margin:2px 0;"></div>
                <a href="privacy.html" class="nav-dropdown-item">PRIVACY POLICY</a>
                <a href="terms.html" class="nav-dropdown-item">TERMS OF SERVICE</a>
            </div>
        </div>
    </nav>

    <div class="notes-page">
        <div class="app">
            <h1>BEAT NOTES</h1>
            <h2 id="projectTitle" class="page-sub"></h2>
            <div id="beatFillRate" style="font-size:0.75rem;color:var(--text-dim);letter-spacing:1px;margin-bottom:20px;">0 / 15 BEATS FILLED</div>
            <div id="beatContainer"></div>
            <button class="btn-secondary" onclick="exportBeats()" style="width:100%;margin-top:16px;">⬇ EXPORT BEAT SHEET</button>
        </div>
    </div>

    <script src="theme.js?v=20261123f"></script>
    <script src="sidebar.js?v=20261124a"></script>
    <script src="period-notice.js?v=20261123f"></script>
    <script src="streak.js?v=20261123f"></script>
    <script src="streak-ui.js?v=20261123f"></script>
    <script src="backup.js?v=20261123f"></script>
    <script src="beat-notes.js?v=20261123f"></script>
    <script src="data-merge.js?v=20261123f"></script>
    <script type="module" src="sync.js?v=20261123f"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }
    </script>
</body>
</html>
