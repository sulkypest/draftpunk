# Sandbox only: tests the database rules against Google's Firestore emulator
# (a local copy of the database that runs inside GitHub's test machine; it
# never touches the real Draft Punk database), and runs the server function
# tests. Runs when the rules or tests change, or by hand from the Actions tab.
name: Rules and function tests
on:
  push:
    paths: ['firestore.rules', 'tests/rules.test.mjs', 'firebase/functions/**', '.github/workflows/rules-test.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - uses: actions/setup-java@v5
        with: { distribution: 'temurin', java-version: '21' }
      - name: Database rules (Firestore emulator)
        run: |
          npm install --no-save --no-package-lock firebase-tools @firebase/rules-unit-testing firebase
          npx firebase emulators:exec --only firestore --project demo-draftpunk "node tests/rules.test.mjs"
      - name: Server functions
        working-directory: firebase/functions
        run: npm ci && npm test
